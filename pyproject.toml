[project]
name = "oura-mcp"
version = "0.1.0"
description = "MCP server for Oura Ring data (API v2)"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.scripts]
oura-mcp = "oura_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["oura_mcp.py", "oura_auth.py"]
